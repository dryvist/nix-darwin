# Overrides only — inherits defaults from shared workflow:
#   warn: 6144, error: 12288, scan: [.md, .nix, .tf], exempt: [CHANGELOG]
extended:
  limit: 32768
  files:
    - AGENTS
    - ANTHROPIC-ECOSYSTEM
    - TROUBLESHOOTING
    # cribl.nix crossed the 12KB error limit on develop, failing every PR's
    # merge-ref file-size check; split the module if it approaches this ceiling
    - cribl
    - flake

exempt:
  - RUNBOOK
  - copilot-permissions-allow
  - copilot-permissions-ask
  - copilot-permissions-deny
  - gemini-permissions-allow
  - gemini-permissions-deny
