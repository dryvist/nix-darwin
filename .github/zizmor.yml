# Zizmor security scanner configuration
# See: https://docs.zizmor.sh/configuration/
#
# Pre-commit uses: --persona=regular --min-severity=medium --min-confidence=medium
# This catches high-signal security issues while reducing noise.
#
# To run a full audit: zizmor --persona=auditor .github/workflows/

rules:
  # POLICY: Well-known trusted actions use version tags, not commit hashes.
  # Hash pinning is reserved for untrusted or lesser-known actions only.
  unpinned-uses:
    disable: true

  # ACCEPTED: workflow_run is the only trigger for reacting to CI completions.
  # ci-fix.yml is safe because:
  # - It only reads logs via the GitHub API (not fork PR code).
  # - It does not execute untrusted fork code.
  # - ci-fix.yml: the should-fix job validates the PR exists and belongs to this repo.
  dangerous-triggers:
    ignore:
      - ci-fix.yml

  # IGNORED: these callers pass secrets: inherit to first-party reusable
  # workflows. Each file is listed so new callers are still audited.
  secrets-inherit:
    ignore:
      - ai-merge-gate.yml
      - ai-pr-care.yml
      - best-practices.yml
      - ci-fix.yml
      - code-simplifier.yml
      - issue-auto-resolve.yml
      - issue-backlog-sweep.yml
      - issue-hygiene.yml
      - issue-sweeper.yml
      - next-steps.yml
      - post-merge-docs-review.yml
      - post-merge-tests.yml

  # IGNORED: Low-confidence credential persistence warnings
  # Most checkouts don't need persist-credentials: false unless
  # the workflow later runs untrusted code with git access
  artipacked:
    ignore:
      - _claude-settings.yml
      - _nix-build.yml
      - ci-file-length.yml
      - ci-gate.yml
      - ci-markdownlint.yml
      - ci-nix.yml
      - ci-package-staleness.yml
      - ci-validate.yml
      - deps-update-flake.yml
      - review-deps.yml
