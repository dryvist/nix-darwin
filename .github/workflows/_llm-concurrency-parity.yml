# Reusable: LLM Serving Concurrency Parity
#
# lib/hosts/mac-studio.nix's serveConcurrency and dryvist/tofu-proxmox's
# pipeline_constants.serving.mlx_llm_concurrency (modules/proxmox-stack/
# constants-serving.tf) are the same number. The active GPU profile has its
# own `serving.llm_concurrency` value consumed by ansible-proxmox-ai. nix's flake
# evaluation is hermetic (no network access at build time), so it cannot
# derive the value the way ansible does — this check is the mechanical
# substitute: it fails the build on drift instead of trusting a comment.
#
# Called by ci-gate.yml (PR, path-filtered on nix changes) and
# ci-llm-concurrency-parity.yml (daily schedule). The tofu-proxmox constants
# are read at the release tag pinned below; Renovate bumps that tag, and the
# bump PR runs this check against the new release.
name: _llm-concurrency-parity

on:
  workflow_call:

permissions:
  contents: read

jobs:
  parity:
    name: Parity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch dryvist/tofu-proxmox serving constants
        run: |
          # renovate: datasource=github-tags depName=dryvist/tofu-proxmox
          TOFU_PROXMOX_REF="v3.35.0"
          curl -fsSL -o /tmp/constants.tf \
            "https://raw.githubusercontent.com/dryvist/tofu-proxmox/${TOFU_PROXMOX_REF}/modules/proxmox-stack/constants-serving.tf"

      - name: Assert parity
        run: |
          scripts/workflows/check-llm-concurrency-parity.sh lib/hosts/mac-studio.nix /tmp/constants.tf
