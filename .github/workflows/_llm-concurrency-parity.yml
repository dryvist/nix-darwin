# Reusable: LLM Serving Concurrency Parity
#
# lib/hosts/mac-studio.nix's serveConcurrency and dryvist/tofu-proxmox's
# pipeline_constants.serving.llm_concurrency (modules/proxmox-stack/
# constants-serving.tf) are the same number, published from tofu-proxmox to
# ansible-proxmox-ai over the tofu_data.constants channel. nix's flake
# evaluation is hermetic (no network access at build time), so it cannot
# derive the value the way ansible does — this check is the mechanical
# substitute: it fails the build on drift instead of trusting a comment.
#
# Called by ci-gate.yml (PR, path-filtered on nix changes) and
# ci-llm-concurrency-parity.yml (daily schedule, to catch drift introduced
# purely on the tofu-proxmox side with no nix-darwin commit of its own).
name: _llm-concurrency-parity

on:
  workflow_call:

permissions:
  contents: read

jobs:
  parity:
    name: Parity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch dryvist/tofu-proxmox serving constants
        run: |
          curl -fsSL -o /tmp/constants.tf \
            https://raw.githubusercontent.com/dryvist/tofu-proxmox/main/modules/proxmox-stack/constants-serving.tf

      - name: Assert parity
        run: |
          scripts/workflows/check-llm-concurrency-parity.sh lib/hosts/mac-studio.nix /tmp/constants.tf
