# Refresh the nixpkgs channel pin (scheduled)
#
# nixpkgs is pinned to a moving CHANNEL BRANCH (nixpkgs-26.05-darwin, below).
# Renovate's nix manager bumps an input when its git ref changes — a channel
# branch's ref never changes, so Renovate never advances this lock. See
# deps-update-flake.yml's header for the JacobPEvans-input side of this; this
# workflow is the channel-pin side, delegated to the org-shared refresher.
name: Refresh nixpkgs channel

on:
  schedule:
    - cron: "0 6 * * 2" # Tue 06:00 UTC
  workflow_dispatch: {}

permissions: {}

jobs:
  refresh:
    uses: dryvist/.github/.github/workflows/_refresh-nixpkgs-channel.yml@main
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
