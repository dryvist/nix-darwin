# AI-powered review of flake.lock updates
# Analyzes dependency changes and conditionally enables auto-merge for low-risk updates
name: Review Flake Update

on:
  workflow_dispatch:
  # --- DISABLED AUTOMATIC TRIGGERS (restore by uncommenting) ---
  # pull_request:
  #   types: [opened, synchronize, labeled]
  #   paths:
  #     - "flake.lock"
  # --- END DISABLED ---

jobs:
  review:
    name: AI Dependency Review
    # Only run on PRs with the 'dependencies' label
    if: contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Full history for diff analysis

      - name: Checkout prompt catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dryvist/ai-llm-prompts
          ref: 0431be6994d51169b9f705ddeba958eb8a4d0fc4
          path: .prompt-catalog
          sparse-checkout: developer-tools/nix-darwin-flake-review.md
          sparse-checkout-cone-mode: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - name: Generate flake.lock diff
        id: diff
        run: |
          # Get the diff between base and head using PR base sha for reliability
          DIFF=$(git diff ${{ github.event.pull_request.base.sha }}...HEAD -- flake.lock)
          printf '%s\n' "$DIFF" > "$RUNNER_TEMP/flake-lock.diff"
          # Save diff to output (escape for multiline)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Render review prompt
        id: prompt
        run: |
          awk 'BEGIN { markers = 0 } /^---$/ { markers++; next } markers >= 2 { print }' \
            .prompt-catalog/developer-tools/nix-darwin-flake-review.md \
            | DIFF_FILE="$RUNNER_TEMP/flake-lock.diff" awk \
              '/steps\.diff\.outputs\.content/ { while ((getline line < ENVIRON["DIFF_FILE"]) > 0) print line; next } { print }' \
              > "$RUNNER_TEMP/review-prompt.md"
          echo 'content<<EOF' >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/review-prompt.md" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          allowed_bots: "jacobpevans-github-actions"
          claude_args: |
            --max-turns 5

          prompt: |
            ${{ steps.prompt.outputs.content }}

      - name: Check review decision
        id: check-decision
        run: |
          # Read Claude's execution output
          if [ -f "${{ steps.claude-review.outputs.execution_file }}" ]; then
            # Check if the review contains AUTO-MERGE decision
            if grep -q "DECISION: AUTO-MERGE" "${{ steps.claude-review.outputs.execution_file }}"; then
              echo "decision=auto-merge" >> $GITHUB_OUTPUT
              echo "Claude recommended auto-merge"
            elif grep -q "DECISION: HOLD" "${{ steps.claude-review.outputs.execution_file }}"; then
              echo "decision=hold" >> $GITHUB_OUTPUT
              echo "Claude recommended holding for human review"
            else
              echo "decision=hold" >> $GITHUB_OUTPUT
              echo "::warning::Could not parse decision from Claude response, defaulting to hold"
            fi
          else
            echo "decision=hold" >> $GITHUB_OUTPUT
            echo "::warning::Execution file not found, defaulting to hold"
          fi

      - name: Enable auto-merge if approved
        if: steps.check-decision.outputs.decision == 'auto-merge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Enabling auto-merge for PR #${{ github.event.pull_request.number }}"
          gh pr merge --auto --squash --delete-branch "${{ github.event.pull_request.number }}" || {
            echo "::warning::Failed to enable auto-merge. Ensure auto-merge is enabled in repository settings."
            exit 0
          }
