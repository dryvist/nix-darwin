# Nix CI - Build workflow (standalone)
#
# Runs on push to develop to populate the Nix store cache. PRs use
# ci-gate.yml instead. main is deliberately NOT a trigger: git-flow promotes
# the already-built develop tree unchanged, and the cache is only saved on
# develop (see _nix-build.yml `save:`), so a main rebuild is a pure duplicate.
# Calls reusable workflow for DRY.

name: Nix Build

on:
  push:
    branches: [develop]
    paths:
      - '**.nix'
      - 'flake.lock'
      - 'modules/**'
      - 'scripts/**'
  # Keep the cache alive through quiet weeks.
  #
  # GitHub deletes any cache not accessed within the retention window
  # regardless of size — dryvist sets that to 10 days (the org maximum). Without
  # a heartbeat, a fortnight with no nix-touching merge silently expires every
  # entry and the next PR cold-builds the whole closure.
  #
  # Weekly leaves 3 days of margin. Scheduled runs execute on the default
  # branch, so `save:` in _nix-build.yml already matches and this refreshes the
  # cache rather than merely reading it.
  #
  # Friday early-UTC deliberately: most development here lands Friday through
  # Sunday, so this warms the cache immediately BEFORE the busy window rather
  # than after it. A Monday run would refresh a cache that the weekend had
  # already been forced to cold-build against.
  schedule:
    - cron: '0 9 * * 5' # Fridays 09:00 UTC (early morning US)
  workflow_dispatch:

# Never cancel a run on a cache-saving branch.
#
# This workflow is the ONLY thing that populates the Nix store cache, and it does
# so on the default branch. The build takes hours, so with `cancel-in-progress`
# unconditionally true every merge killed the run that was about to save — and
# the next merge killed its replacement. Measured over the last 40 runs:
# develop 16 success / 23 cancelled, main 20 success / 0 cancelled. The branch
# that saves the cache is the one that almost never finishes.
#
# Superseding is still right for throwaway refs, so this cancels everywhere else
# and only protects develop, whose completion saves the cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read
  # _nix-build.yml purges superseded Nix caches, which needs the Actions cache
  # API. A called workflow can never exceed its caller's grant, so omitting this
  # fails the run at graph validation — startup_failure, with no job and no logs
  # to explain it. That is exactly how this shipped broken once: the PR passed
  # because ci-gate.yml (the other caller) already grants actions: write, and
  # only the push to develop went red.
  actions: write

jobs:
  build:
    name: Build Nix
    uses: ./.github/workflows/_nix-build.yml
