# Reusable: Nix Validate (local copy)
#
# Local copy of JacobPEvans-personal/.github/.github/workflows/_nix-validate.yml@main.
# This copy originally diverged only to inject `AI_MODEL_LOCAL_LLM` for an
# eval-time `builtins.getEnv`; that sourcing was removed (the value is now
# committed in `lib/user-config.nix`), so the copy no longer needs to diverge.
# FOLLOW-UP: re-sync to / replace this local copy with the shared workflow.

name: _nix-validate

on:
  workflow_call:
    inputs:
      runner_label:
        type: string
        required: false
        default: ubuntu-latest
      all_systems:
        type: boolean
        required: false
        default: true

concurrency:
  group: nix-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        if: inputs.all_systems && startsWith(inputs.runner_label, 'ubuntu-')
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
          docker-images: true

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0
            http-connections = 50
            connect-timeout = 5
            stalled-download-timeout = 10
            narinfo-cache-positive-ttl = 86400
            fallback = true
            log-lines = 1000

      - name: Restore Nix Store Cache
        uses: actions/cache/restore@v5
        id: nix-cache
        with:
          path: |
            /nix/store
            ~/.cache/nix
          key: nix-linux-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-linux-${{ runner.os }}-

      - name: Check flake
        env:
          ALL_SYSTEMS_FLAG: ${{ inputs.all_systems && '--all-systems' || '' }}
        run: nix flake check $ALL_SYSTEMS_FLAG --print-build-logs --show-trace --keep-going

      - name: Save Nix Store Cache
        if: github.event_name == 'push' && steps.nix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /nix/store
            ~/.cache/nix
          key: nix-linux-${{ runner.os }}-${{ hashFiles('flake.lock') }}
