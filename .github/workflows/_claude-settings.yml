# Reusable: Claude Settings Validation
# Called by ci-gate.yml and ci-validate-settings.yml
name: _claude-settings

on:
  workflow_call:

# Performance: Cancel in-progress validation when new commits arrive
concurrency:
  group: claude-settings-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    # Self-hosted RunsOn runner — see terraform-runs-on/docs/migration-guide.md
    runs-on: "runs-on=${{ github.run_id }}/runner=2cpu-linux-x64"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Performance: Install Nix with built-in caching
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3

      # Restore-only on PRs; saves on main. See .claude/rules/ci-workflows.md.
      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-
          gc-max-store-size-linux: 3G
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Start Validation Timer
        id: validation-timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Fetch schema
        run: |
          curl -sL https://json.schemastore.org/claude-code-settings.json \
            -o claude-code-settings.schema.json

      - name: Extract settings via nix eval
        run: |
          nix eval --raw '.#lib.ci.claudeSettingsJson' > settings-generated.json

      - name: Validate settings files
        run: |
          nix-shell -p check-jsonschema --run '
            echo "Validating Claude Code settings..."
            check-jsonschema --schemafile claude-code-settings.schema.json settings-generated.json
            echo "Settings validation passed!"
          '

      - name: Check for invalid permission patterns
        run: |
          echo "Checking for :*:* patterns in permissions..."
          PATTERN_CHECK=$(nix eval --json '.#lib.ci.claudeSettingsJson' 2>/dev/null | grep -c ':\*:\*' || true)
          if [ "$PATTERN_CHECK" -gt 0 ]; then
            echo "::error::Found :*:* pattern in permissions"
            echo "::error::Source permission files should not have :* suffix"
            echo "::error::The Nix formatter adds :* automatically"
            echo "::error::Example: 'git' → 'Bash(git:*)' (correct)"
            echo "::error::Example: 'git:*' → 'Bash(git:*:*)' (wrong)"
            exit 1
          fi
          echo "Permission patterns are valid!"

      # Semantic guard: every homelab.allowRules value declared in the consumer
      # (lib/user-config.nix) must round-trip into the host's rendered
      # autoMode.allow. If the nix-ai flake input is pinned to a rev that predates
      # the homelab.allowRules wiring, the `... or [ ]` fallback silently drops the
      # values and the classifier rules never take effect — a build that passes but
      # renders nothing ("merged != live"). This asserts that cannot happen unnoticed.
      # jevans-mbp is representative: the wiring is host-agnostic, so one homelab
      # host with homelab.enable = true suffices to catch a stale/broken pin.
      - name: Assert homelab allowRules render into autoMode.allow
        run: |
          declared="$(nix eval --impure --json \
            --expr "(import $PWD/lib/user-config.nix).homelab.allowRules or []")"
          rendered="$(nix eval --json \
            '.#darwinConfigurations.jevans-mbp.config.home-manager.users.jevans.programs.claude.autoMode.allow')"
          python3 - "$declared" "$rendered" <<'PY'
          import json, sys
          declared = json.loads(sys.argv[1])
          rendered = set(json.loads(sys.argv[2]))
          missing = [d for d in declared if d not in rendered]
          if missing:
              print("::error::homelab.allowRules declared in lib/user-config.nix but NOT "
                    "rendered into autoMode.allow.")
              print("::error::Most likely the nix-ai flake input predates the "
                    "homelab.allowRules wiring - bump flake.lock (deps-update-flake.yml).")
              for m in missing:
                  print(f"::error:: unrendered rule: {m[:70]}...")
              sys.exit(1)
          print(f"OK: all {len(declared)} homelab.allowRules round-trip "
                f"into autoMode.allow ({len(rendered)} rules total).")
          PY

      - name: Validation Timing
        if: always()
        run: |
          start="${{ steps.validation-timer.outputs.start }}"
          if [ -n "$start" ]; then
            elapsed=$(( $(date +%s) - start ))
            echo "::notice::Settings validation completed in ${elapsed}s"
          fi
