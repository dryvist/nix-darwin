name: Code Simplifier

on:
  workflow_dispatch:
  # --- DISABLED AUTOMATIC TRIGGERS (restore by uncommenting) ---
  # schedule:
  #   - cron: "0 4 * * 0,3,6"
  # --- END DISABLED ---

permissions: {}

jobs:
  dispatch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-trigger as workflow_dispatch
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "$WORKFLOW_NAME" --repo "${{ github.repository }}"

  simplify:
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    if: github.event_name != 'schedule'
    uses: dryvist/ai-workflows/.github/workflows/cc-code-simplifier.yml@22d262fbeca2f783851dc0c2934d74edd9809893 # v0.49.1
    secrets: inherit
