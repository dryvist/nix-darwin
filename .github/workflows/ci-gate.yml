# CI Gate — thin caller of the org reusable gate, plus the three checks it
# cannot host.
#
# Change detection, Nix Validate, Markdown Lint and File Size all run inside
# dryvist/.github/.github/workflows/_ci-gate.yml@main. Nix Validate gets its
# own larger runner through `nix_validate_runner_label`; the doc checks stay on
# the 2cpu runner. Repo-local jobs gate on the shared gate's exported change
# detection — there is no second `changes` job here.
#
# What stays local, and why the shared gate cannot own it:
#   nix-build              — the macOS system build, on this repo's own
#                            `_nix-build.yml` (mac-fleet runner, cache purge).
#   claude-settings        — validates the rendered Claude settings; keyed on
#                            the `extra` filter (.claude/** and flake.lock).
#   llm-concurrency-parity — a cross-repo constant check specific to this repo.
#
# The local `Merge Gate` re-aggregates the shared gate plus those three so the
# required status check context stays exactly "Merge Gate".
#
# Fork-PR security guard: nix-darwin is PUBLIC, so `pull_request` from fork
# branches would otherwise execute fork-author-controlled code on our
# self-hosted RunsOn runners. The `runs-on:` expression routes same-repo PRs to
# RunsOn and falls back to `ubuntu-latest` for fork PRs; the shared gate
# re-applies the identical guard to every label it is handed.
# Pattern reference: runs-on.com/configuration/job-labels (Fork PRs).
#
# dependency_review and zizmor are left off to keep this migration purely
# structural (this repo has never run them); enabling them is a fast-follow.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # The full macOS build is post-merge; PRs use the shared Nix Validate check.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Main merge builds populate the Nix cache; let them finish. PR updates cancel.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # ==========================================================================
  # SHARED GATE — change detection + Nix Validate + Markdown Lint + File Size
  # ==========================================================================
  shared-gate:
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant, so
      # actions: write must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: dryvist/.github/.github/workflows/_ci-gate.yml@d93c868d5e3a12d012eb381200d17b34c10eea59 # v1.7.0
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    with:
      osv_scan: true
      nix_validate: true
      # This flake declares checks.aarch64-darwin.pf-anchor-syntax, which
      # shells out to /sbin/pfctl; `--all-systems` would make a Linux runner
      # try to build it and fail on platform mismatch.
      all_systems: false
      # Dependency-only bot PRs skip Nix Validate unless flake.lock itself
      # changed — a lockfile bump must still validate.
      nix_skip_deps_only: true
      dependency_review: false
      zizmor: false
      queue_timeout_minutes: 30
      runner_label: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('runs-on={0}/runner=2cpu-linux-x64', github.run_id) || 'ubuntu-latest' }}
      nix_validate_runner_label: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('runs-on={0}/cpu=4/ram=16/family=m7+c7/extras=s3-cache', github.run_id) || 'ubuntu-latest' }}
      filters: |
        nix:
          - '**.nix'
          - 'flake.lock'
          - 'modules/**'
          - 'hosts/**'
          - 'scripts/**'
        markdown:
          - '**.md'
          - '.markdownlint.json'
          - '.markdownlint.yml'
        extra:
          - '.claude/**'
          # flake.lock changes the rendered settings via the nix-ai input
          # (e.g. homelab.allowRules), so settings validation must run on a
          # deps-only lock bump too — otherwise a stale pin ships unchecked.
          - 'flake.lock'

  # ==========================================================================
  # REPO-LOCAL CHECKS (reusable workflows the shared gate cannot host)
  # ==========================================================================
  # Full-build placement: only a commit that has landed on main runs the
  # macOS build. Every PR, including promotion PRs and lockfile updates, uses
  # Nix Validate; ci-nix.yml also validates develop pushes.
  nix-build:
    name: Nix Build
    needs: shared-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.shared-gate.outputs.nix == 'true'
    permissions:
      contents: read
      # _nix-build.yml's cache step purges superseded entries through the
      # Actions cache API. A called workflow can never exceed its caller's
      # grant, and this job inherits the workflow-level block above, which does
      # not include actions:write — so without this the whole run dies at graph
      # validation. That failure produces NO check-runs at all, so a PR shows
      # mergeStateStatus CLEAN with no failing check while nothing has run.
      # The actions:write on the shared-gate job does not cover this one;
      # permissions are per-job.
      actions: write
    uses: ./.github/workflows/_nix-build.yml

  claude-settings:
    name: Claude Settings
    needs: shared-gate
    if: needs.shared-gate.outputs.extra == 'true'
    uses: ./.github/workflows/_claude-settings.yml

  # Cross-repo mechanical check: lib/hosts/mac-studio.nix's serveConcurrency
  # must equal dryvist/tofu-proxmox's pipeline_constants.serving.mlx_llm_concurrency.
  # See _llm-concurrency-parity.yml header.
  llm-concurrency-parity:
    name: LLM Concurrency Parity
    needs: shared-gate
    if: needs.shared-gate.outputs.nix == 'true'
    uses: ./.github/workflows/_llm-concurrency-parity.yml

  # ==========================================================================
  # MERGE GATE - The ONLY required check in branch protection
  # ==========================================================================
  gate:
    name: Merge Gate
    needs: [shared-gate, nix-build, claude-settings, llm-concurrency-parity]
    if: ${{ !cancelled() }}
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('runs-on={0}/runner=2cpu-linux-x64', github.run_id) || 'ubuntu-latest' }}
    steps:
      - name: Check all results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          # Each job's own `if:` decides when it runs; a failure always fails
          # the gate, so every conditional job may be skipped.
          allowed-skips: nix-build, claude-settings, llm-concurrency-parity
          jobs: ${{ toJSON(needs) }}
