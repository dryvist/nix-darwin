# CI Gate — local Merge Gate over the org reusable gate + repo-local jobs.
#
# The standard doc checks (Markdown Lint, File Size) and their aggregation are
# delegated to dryvist/.github/.github/workflows/_ci-gate.yml@main. The bespoke
# macOS Nix Build, the Claude settings validation, and Nix Validate stay
# repo-local: the shared gate cannot dispatch a consumer-local job, and its
# single runner_label cannot give Nix Validate the larger self-hosted runner it
# needs while keeping the doc checks on the 2cpu runner. A repo-local "Merge
# Gate" re-aggregates the shared gate's result plus those local jobs, so the
# required status check context stays exactly "Merge Gate".
#
# A repo-local `changes` job is still needed: the shared gate exposes no
# workflow_call outputs, so the local nix-build / nix-validate / claude-settings
# jobs need their own path triggers. Markdown/file-size detection lives inside
# the shared gate.
#
# Fork-PR security guard:
# nix-darwin is PUBLIC, so `pull_request` from fork branches would otherwise
# execute fork-author-controlled code on our self-hosted RunsOn runners. The
# `runs-on:` expression routes same-repo PRs to RunsOn and falls back to
# `ubuntu-latest` for fork PRs; the same expression is passed through
# `runner_label` to the shared gate (which re-applies its own identical guard)
# and to the local reusable-workflow calls.
# Pattern reference: runs-on.com/configuration/job-labels (Fork PRs).
#
# dependency_review and zizmor are left off to keep this migration purely
# structural (this repo has never run them); enabling them is a fast-follow.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ==========================================================================
  # CHANGE DETECTION (repo-local — drives the local nix/claude jobs only)
  # ==========================================================================
  changes:
    name: Detect Changes
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('runs-on={0}/runner=2cpu-linux-x64', github.run_id) || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      claude: ${{ steps.filter.outputs.claude }}
      is-deps-only: ${{ steps.detect-deps.outputs.is-deps-only }}
      is-flake-lock-change: ${{ steps.filter.outputs.flake-lock }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            nix:
              - '**.nix'
              - 'flake.lock'
              - 'modules/**'
              - 'hosts/**'
              - 'scripts/**'
            flake-lock:
              - 'flake.lock'
            claude:
              - '.claude/**'
              # flake.lock changes the rendered settings via the nix-ai input
              # (e.g. homelab.allowRules), so settings validation must run on a
              # deps-only lock bump too — otherwise a stale pin ships unchecked.
              - 'flake.lock'

      - name: Detect Dependency-Only Commits
        id: detect-deps
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          COMMIT_MSG: ${{ github.event.pull_request.title }}
        run: |
          # Skip nix-build only if:
          # 1. Author is jacobpevans-github-actions (Renovate bot, with or without [bot] suffix)
          # 2. Commit message starts with "chore(deps)"
          if [[ "$AUTHOR" == "jacobpevans-github-actions"* && "$COMMIT_MSG" == chore\(deps\)* ]]; then
            echo "is-deps-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-deps-only=false" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================================================
  # SHARED GATE — Markdown Lint + File Size via the org reusable gate.
  # The shared gate's File Size job keys off the `nix`/`markdown` filter
  # outputs; nix source globs are supplied under `nix` so file-size still runs
  # on nix changes. `nix_validate` stays local (runner-size), so the `nix` key
  # here only drives file-size.
  # ==========================================================================
  shared-gate:
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant, so
      # actions: write must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: dryvist/.github/.github/workflows/_ci-gate.yml@main
    with:
      markdown_lint: true
      file_size: true
      dependency_review: false
      zizmor: false
      runner_label: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('runs-on={0}/runner=2cpu-linux-x64', github.run_id) || 'ubuntu-latest' }}
      filters: |
        nix:
          - '**.nix'
          - 'flake.lock'
          - 'modules/**'
          - 'hosts/**'
          - 'scripts/**'
        markdown:
          - '**.md'
          - '.markdownlint.json'
          - '.markdownlint.yml'

  # ==========================================================================
  # CONDITIONAL CHECKS (repo-local — reusable workflows the shared gate can't host)
  # ==========================================================================
  nix-build:
    name: Nix Build
    needs: changes
    if: needs.changes.outputs.nix == 'true' && (needs.changes.outputs.is-deps-only == 'false' || needs.changes.outputs.is-flake-lock-change == 'true')
    uses: ./.github/workflows/_nix-build.yml

  nix-validate:
    name: Nix Validate
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@main
    with:
      # Linux `nix flake check --all-systems` needs more disk/RAM for
      # darwin-source substitution; m7+c7 family with s3-cache fits.
      # Fork PRs fall back to ubuntu-latest (see header comment on `changes`).
      runner_label: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('runs-on={0}/cpu=4/ram=16/family=m7+c7/extras=s3-cache', github.run_id) || 'ubuntu-latest' }}

  claude-settings:
    name: Claude Settings
    needs: changes
    if: needs.changes.outputs.claude == 'true'
    uses: ./.github/workflows/_claude-settings.yml

  # Cross-repo mechanical check: lib/hosts/mac-studio.nix's serveConcurrency
  # must equal dryvist/tofu-proxmox's pipeline_constants.serving.llm_concurrency
  # (the single source of truth). See _llm-concurrency-parity.yml header.
  llm-concurrency-parity:
    name: LLM Concurrency Parity
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    uses: ./.github/workflows/_llm-concurrency-parity.yml

  # ==========================================================================
  # MERGE GATE - The ONLY required check in branch protection
  # ==========================================================================
  gate:
    name: Merge Gate
    needs: [changes, shared-gate, nix-build, nix-validate, claude-settings, llm-concurrency-parity]
    if: ${{ !cancelled() }}
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('runs-on={0}/runner=2cpu-linux-x64', github.run_id) || 'ubuntu-latest' }}
    steps:
      - name: Check all results
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          # For deps-only commits: nix-build and nix-validate can be skipped
          # For non-Nix changes: nix-build and nix-validate can be skipped
          # For Nix changes: only nix-validate can be skipped, nix-build must pass
          # claude-settings is intentionally NOT skippable for deps-only: a
          # flake.lock bump can change the rendered settings, so it must validate.
          # llm-concurrency-parity shares nix-validate's `if:` (any nix change),
          # so it is skippable in exactly the same cases nix-validate is.
          # shared-gate is never skippable — it always reports.
          allowed-skips: ${{ (needs.changes.outputs.is-deps-only == 'true' && 'nix-build, nix-validate, llm-concurrency-parity') || (needs.changes.outputs.nix == 'false' && 'nix-build, nix-validate, claude-settings, llm-concurrency-parity') || 'nix-validate, claude-settings, llm-concurrency-parity' }}
          jobs: ${{ toJSON(needs) }}
