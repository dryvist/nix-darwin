name: Package Staleness Check

# Purpose: Report flake.lock inputs that are old. Report-only: the job never
# fails and never blocks a merge, because a first-party bump is a deliberate
# pull request and age alone is not a reason to force one.
# Thresholds (scripts/validate-package-freshness.sh):
#   - Critical packages (nixpkgs, home-manager, ai-assistant-instructions): >30 days = STALE
#   - All direct inputs: >90 days = STALE

on:
  pull_request:
    paths:
      - 'flake.lock'
      - '.github/workflows/ci-package-staleness.yml'
      - 'scripts/validate-package-freshness.sh'
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-staleness:
    name: Verify package freshness
    # Fork-PR security guard: same-repo PRs and workflow_dispatch runs use
    # RunsOn; only fork PRs fall back to ubuntu-latest (github-hosted) so
    # fork-author code never touches our self-hosted runners. See ci-gate.yml
    # header for the full rationale.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('runs-on={0}/runner=2cpu-linux-x64', github.run_id) || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Report package freshness
        shell: bash
        run: |
          {
            echo '```text'
            bash scripts/validate-package-freshness.sh | sed -E 's/\x1B\[[0-9;]*m//g'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
